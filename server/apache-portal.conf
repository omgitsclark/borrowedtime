# Artist portal: Apache lines for the borrowedtime <VirtualHost *:443> block.
# Included from /etc/httpd/conf/httpd-le-ssl.conf with:
#     Include /var/www/html/borrowedtime/server/apache-portal.conf
# Changes here need `sudo apachectl configtest && sudo systemctl reload httpd` on the server.

# Login and photo management go to the portal service.
ProxyPass        /studio/api http://127.0.0.1:8788/studio/api
ProxyPassReverse /studio/api http://127.0.0.1:8788/studio/api
<Location "/studio/api">
    # Phone photos can be large; the service shrinks them.
    LimitRequestBody 31457280
</Location>

# The live gallery list and uploaded photos live outside the git checkout, served at the
# addresses the pages already use. Only these are public; the rest of the folder
# (PIN hashes, lockouts, backups) is never served.
Alias /data/gallery.json /var/lib/borrowedtime/gallery.json
Alias /images/thumbs/uploads /var/lib/borrowedtime/thumbs
Alias /images/uploads /var/lib/borrowedtime/uploads
<Directory "/var/lib/borrowedtime">
    Require all denied
    <Files "gallery.json">
        Require all granted
    </Files>
</Directory>
<Directory "/var/lib/borrowedtime/uploads">
    Options -Indexes
    Require all granted
</Directory>
<Directory "/var/lib/borrowedtime/thumbs">
    Options -Indexes
    Require all granted
</Directory>

# The portal's code is in the site folder but isn't part of the website.
RedirectMatch 404 ^/server(/|$)
